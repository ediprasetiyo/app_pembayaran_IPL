[phases.setup]
nixPkgs = [
  'php84',
  'php84Extensions.pdo',
  'php84Extensions.pdo_mysql',
  'php84Extensions.mysqli',
  'php84Extensions.openssl',
  'php84Extensions.mbstring',
  'php84Extensions.bcmath',
  'php84Extensions.fileinfo',
  'php84Extensions.curl',
  'php84Extensions.zip',
  'php84Extensions.gd',
  'php84Extensions.sodium',
  'php84Extensions.tokenizer',
  'php84Extensions.dom',
  'php84Extensions.ctype',
  'php84Extensions.xml',
  'php84Extensions.simplexml',
  'php84Extensions.session',
  'php84Extensions.iconv',
  'php84Packages.composer',
  'nodejs_20',
]

[phases.install]
cmds = [
  'composer install --no-dev --optimize-autoloader --ignore-platform-reqs',
]

[phases.build]
cmds = [
  'rm -rf bootstrap/cache/*.php',
  'rm -rf storage/framework/cache/data/*',
  'rm -rf storage/framework/views/*.php',
  'mkdir -p storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache',
  'chmod -R 777 storage bootstrap/cache',
]

[start]
cmd = '''printf "APP_NAME=%s\nAPP_ENV=%s\nAPP_KEY=%s\nAPP_DEBUG=%s\nAPP_URL=%s\nLOG_CHANNEL=%s\nLOG_LEVEL=%s\nDB_CONNECTION=%s\nDB_HOST=%s\nDB_PORT=%s\nDB_DATABASE=%s\nDB_USERNAME=%s\nDB_PASSWORD=%s\nMIDTRANS_SERVER_KEY=%s\nMIDTRANS_CLIENT_KEY=%s\nMIDTRANS_IS_PRODUCTION=%s\nMIDTRANS_IS_SANITIZED=%s\nMIDTRANS_IS_3DS=%s\nIPL_MONTHLY_AMOUNT=%s\nIPL_KEDUKAAN_AMOUNT=%s\nADMIN_PHONE=%s\nFRONTEND_URL=%s\nFILESYSTEM_DISK=%s\nCACHE_DRIVER=%s\nSESSION_DRIVER=%s\nQUEUE_CONNECTION=%s\n" "$APP_NAME" "$APP_ENV" "$APP_KEY" "$APP_DEBUG" "$APP_URL" "$LOG_CHANNEL" "$LOG_LEVEL" "$DB_CONNECTION" "$DB_HOST" "$DB_PORT" "$DB_DATABASE" "$DB_USERNAME" "$DB_PASSWORD" "$MIDTRANS_SERVER_KEY" "$MIDTRANS_CLIENT_KEY" "$MIDTRANS_IS_PRODUCTION" "$MIDTRANS_IS_SANITIZED" "$MIDTRANS_IS_3DS" "$IPL_MONTHLY_AMOUNT" "$IPL_KEDUKAAN_AMOUNT" "$ADMIN_PHONE" "$FRONTEND_URL" "$FILESYSTEM_DISK" "$CACHE_DRIVER" "$SESSION_DRIVER" "$QUEUE_CONNECTION" > .env && php artisan config:clear && php artisan cache:clear && php artisan view:clear && php artisan route:clear && php artisan migrate --force --no-interaction || true && php artisan serve --host=0.0.0.0 --port=$PORT'''
