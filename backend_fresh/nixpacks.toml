[phases.setup]
nixPkgs = [
  'php84',
  'php84Extensions.pdo_mysql',
  'php84Extensions.openssl',
  'php84Extensions.mbstring',
  'php84Extensions.bcmath',
  'php84Extensions.fileinfo',
  'php84Extensions.curl',
  'php84Extensions.zip',
  'php84Extensions.gd',
  'php84Extensions.sodium',
  'php84Packages.composer',
  'nodejs_20',
]

[phases.install]
cmds = [
  'composer install --no-dev --optimize-autoloader --ignore-platform-reqs',
]

[phases.build]
cmds = [
  'touch .env',
  'php artisan storage:link || true',
]

[start]
cmd = 'php artisan config:clear && php artisan cache:clear && (test -n "$APP_KEY" || php artisan key:generate --force) && php artisan migrate --force && php -S 0.0.0.0:$PORT -t public'
