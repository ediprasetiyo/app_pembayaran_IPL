name: ipl_griya_pesona
description: Aplikasi Pembayaran IPL Perumahan Griya Pesona Madani Tenjo
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # HTTP
  dio: ^5.4.0

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # UI Components
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fluttertoast: ^8.2.4

  # Payment - Midtrans via WebView (Snap URL)
  webview_flutter: ^4.4.4

  # Notifications — FCM push + local foreground display
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.19
  flutter_local_notifications: ^17.2.3

  # Image
  image_picker: ^1.0.7

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.2.4
  connectivity_plus: ^5.0.2

  # Icons
  font_awesome_flutter: ^10.7.0

  # Share
  share_plus: ^7.2.2

  # HTML rendering (untuk konten berita dengan format)
  flutter_html: ^3.0.0-beta.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  # Background warna putih agar icon tampil bersih (logo punya area transparan)
  background_color_android: "#FFFFFF"
  # Adaptive icon untuk Android 8+ (logo dengan padding biar tidak ke-crop)
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"
  adaptive_icon_foreground_inset: 16
  # Web icon (opsional)
  web:
    generate: false
