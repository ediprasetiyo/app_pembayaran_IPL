plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    // Google Services plugin for FCM (Firebase Cloud Messaging)
    id "com.google.gms.google-services"
}

android {
    namespace = "com.griyapesonamadani.ipl_griya_pesona"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.griyapesonamadani.ipl_griya_pesona"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 21
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }

}

// AGP 8+ Variant API — rename APK output yang dihasilkan Gradle.
// Flutter akan copy file dengan nama yang sudah kita set di sini.
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def newName = (variant.buildType == "release")
                ? "IPL_Griya_Pesona_Madani.apk"
                : "IPL_Griya_Pesona_Madani-${variant.buildType}.apk"
            output.outputFileName.set(newName)
        }
    }
}

flutter {
    source = "../.."
}
